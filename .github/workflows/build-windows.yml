name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build executable
        run: >
          pyinstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name RapidClick
          --collect-all customtkinter
          main.py

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\RapidClick.exe -Algorithm SHA256).Hash
          "$hash *RapidClick.exe" | Set-Content dist\RapidClick.exe.sha256 -Encoding ASCII -NoNewline

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: RapidClick-Windows
          path: |
            dist/RapidClick.exe
            dist/RapidClick.exe.sha256

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (gh release view $tag 2>$null) {
            gh release upload $tag `
              dist\RapidClick.exe `
              dist\RapidClick.exe.sha256 `
              --clobber
          } else {
            gh release create $tag `
              dist\RapidClick.exe `
              dist\RapidClick.exe.sha256 `
              --title $tag `
              --generate-notes
          }
